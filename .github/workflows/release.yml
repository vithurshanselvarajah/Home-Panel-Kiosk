name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Tag package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
            TAG_COMMIT=$(git rev-parse "${TAG}^{commit}")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag ${TAG} already points to ${TAG_COMMIT}, not ${GITHUB_SHA}." >&2
              exit 1
            fi
            echo "Tag ${TAG} already points to this commit; continuing release."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Build and publish Linux packages
        run: npm run release -- --arch=arm64,x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
