syntax = "proto3";

// Trimmed from the ESPHome api.proto. Only the messages the Home Panel
// device side needs are kept.

package esphome;

option go_package = "github.com/vithurshanselvarajah/Home-Panel-Kiosk/device/esphome;esphome";

enum DeviceRelation {
  DEVICE_RELATION_VIA = 0;
  DEVICE_RELATION_CHILD = 1;
}

enum DisconnectReason {
  // No specific reason / not provided (default for older peers).
  DISCONNECT_REASON_UNSPECIFIED = 0;
  // The device's provisioning window has expired. The device must be reset
  // (power-cycled) to reopen the provisioning window before it will accept a
  // connection again.
  DISCONNECT_REASON_PROVISIONING_CLOSED = 1;
}

enum EntityCategory {
  ENTITY_CATEGORY_NONE = 0;
  ENTITY_CATEGORY_CONFIG = 1;
  ENTITY_CATEGORY_DIAGNOSTIC = 2;
}

enum MediaPlayerCommand {
  MEDIA_PLAYER_COMMAND_PLAY = 0;
  MEDIA_PLAYER_COMMAND_PAUSE = 1;
  MEDIA_PLAYER_COMMAND_STOP = 2;
  MEDIA_PLAYER_COMMAND_MUTE = 3;
  MEDIA_PLAYER_COMMAND_UNMUTE = 4;
  MEDIA_PLAYER_COMMAND_TOGGLE = 5;
  MEDIA_PLAYER_COMMAND_VOLUME_UP = 6;
  MEDIA_PLAYER_COMMAND_VOLUME_DOWN = 7;
  MEDIA_PLAYER_COMMAND_ENQUEUE = 8;
  MEDIA_PLAYER_COMMAND_REPEAT_ONE = 9;
  MEDIA_PLAYER_COMMAND_REPEAT_OFF = 10;
  MEDIA_PLAYER_COMMAND_CLEAR_PLAYLIST = 11;
  MEDIA_PLAYER_COMMAND_TURN_ON = 12;
  MEDIA_PLAYER_COMMAND_TURN_OFF = 13;
}

enum MediaPlayerFormatPurpose {
  MEDIA_PLAYER_FORMAT_PURPOSE_DEFAULT = 0;
  MEDIA_PLAYER_FORMAT_PURPOSE_ANNOUNCEMENT = 1;
}

enum MediaPlayerState {
  MEDIA_PLAYER_STATE_NONE = 0;
  MEDIA_PLAYER_STATE_IDLE = 1;
  MEDIA_PLAYER_STATE_PLAYING = 2;
  MEDIA_PLAYER_STATE_PAUSED = 3;
  MEDIA_PLAYER_STATE_ANNOUNCING = 4;
  MEDIA_PLAYER_STATE_OFF = 5;
  MEDIA_PLAYER_STATE_ON = 6;
}

enum NumberMode {
  NUMBER_MODE_AUTO = 0;
  NUMBER_MODE_BOX = 1;
  NUMBER_MODE_SLIDER = 2;
}

enum SendspinPairingTokenStatus {
  // The Sendspin client has not started yet, so the token does not exist yet. Ask again later.
  SENDSPIN_PAIRING_TOKEN_STATUS_NOT_READY = 0;
  SENDSPIN_PAIRING_TOKEN_STATUS_OK = 1;
  // The device has no API encryption key, so it will not send the token. Ask again once a key is set.
  SENDSPIN_PAIRING_TOKEN_STATUS_ENCRYPTION_REQUIRED = 2;
  // Sendspin is turned off and has not started since boot, so the token does not exist yet.
  SENDSPIN_PAIRING_TOKEN_STATUS_DISABLED = 3;
  // The Sendspin client failed to start, and will not start until the device reboots.
  SENDSPIN_PAIRING_TOKEN_STATUS_FAILED = 4;
}

enum SensorLastResetType {
  option deprecated = true;
  LAST_RESET_NONE = 0;
  LAST_RESET_NEVER = 1;
  LAST_RESET_AUTO = 2;
}

enum SensorStateClass {
  STATE_CLASS_NONE = 0;
  STATE_CLASS_MEASUREMENT = 1;
  STATE_CLASS_TOTAL_INCREASING = 2;
  STATE_CLASS_TOTAL = 3;
  STATE_CLASS_MEASUREMENT_ANGLE = 4;
}

enum SerialProxyPortType {
  SERIAL_PROXY_PORT_TYPE_TTL = 0;
  SERIAL_PROXY_PORT_TYPE_RS232 = 1;
  SERIAL_PROXY_PORT_TYPE_RS485 = 2;
  SERIAL_PROXY_PORT_TYPE_USB_SERIAL = 3;  // since API 1.18
}

enum ServiceArgType {
  SERVICE_ARG_TYPE_BOOL = 0;
  SERVICE_ARG_TYPE_INT = 1;
  SERVICE_ARG_TYPE_FLOAT = 2;
  SERVICE_ARG_TYPE_STRING = 3;
  SERVICE_ARG_TYPE_BOOL_ARRAY = 4;
  SERVICE_ARG_TYPE_INT_ARRAY = 5;
  SERVICE_ARG_TYPE_FLOAT_ARRAY = 6;
  SERVICE_ARG_TYPE_STRING_ARRAY = 7;
}

enum SupportsResponseType {
  SUPPORTS_RESPONSE_NONE = 0;
  SUPPORTS_RESPONSE_OPTIONAL = 1;
  SUPPORTS_RESPONSE_ONLY = 2;
  // Status-only response - reports success/error without data payload
  // Value is higher to avoid conflicts with future Home Assistant values
  SUPPORTS_RESPONSE_STATUS = 100;
}

enum TextMode {
  TEXT_MODE_TEXT = 0;
  TEXT_MODE_PASSWORD = 1;
}

enum VoiceAssistantEvent {
  VOICE_ASSISTANT_ERROR = 0;
  VOICE_ASSISTANT_RUN_START = 1;
  VOICE_ASSISTANT_RUN_END = 2;
  VOICE_ASSISTANT_STT_START = 3;
  VOICE_ASSISTANT_STT_END = 4;
  VOICE_ASSISTANT_INTENT_START = 5;
  VOICE_ASSISTANT_INTENT_END = 6;
  VOICE_ASSISTANT_TTS_START = 7;
  VOICE_ASSISTANT_TTS_END = 8;
  VOICE_ASSISTANT_WAKE_WORD_START = 9;
  VOICE_ASSISTANT_WAKE_WORD_END = 10;
  VOICE_ASSISTANT_STT_VAD_START = 11;
  VOICE_ASSISTANT_STT_VAD_END = 12;
  VOICE_ASSISTANT_WAKE_WORD_REJECTED = 13;
  VOICE_ASSISTANT_TTS_STREAM_START = 98;
  VOICE_ASSISTANT_TTS_STREAM_END = 99;
  VOICE_ASSISTANT_INTENT_PROGRESS = 100;
}

enum VoiceAssistantTimerEvent {
  VOICE_ASSISTANT_TIMER_STARTED = 0;
  VOICE_ASSISTANT_TIMER_UPDATED = 1;
  VOICE_ASSISTANT_TIMER_CANCELLED = 2;
  VOICE_ASSISTANT_TIMER_FINISHED = 3;
}

message AreaInfo {
  uint32 area_id = 1;
  // max_data_length matches core/config.FRIENDLY_NAME_MAX_LEN via AREA_SCHEMA
  string name = 2;
}

message BinarySensorStateResponse {





  fixed32 key = 1;
  bool state = 2;
  // If the binary sensor does not have a valid state yet.
  // Equivalent to `!obj->has_state()` - inverse logic to make state packets smaller
  bool missing_state = 3;
  uint32 device_id = 4;
}

message BluetoothProxyCapabilities {
  // Bitmask of the features this proxy supports
  uint32 feature_flags = 1;
  // The Bluetooth mac address of the device. For example "AC:BC:32:89:0E:AA"
  string mac_address = 2;
}

message ButtonCommandRequest {





  fixed32 key = 1;
  uint32 device_id = 2;
}

message CameraImageRequest {




  bool single = 1;
  bool stream = 2;
}

message CameraImageResponse {




  fixed32 key = 1;
  bytes data = 2;
  bool done = 3;
  uint32 device_id = 4;
}

message CrashReportCapabilities {
  // Bitmask of CrashReportFlag. ESP32 checks BUILD_MATCHES against the build time stored with the record;
  // ESP8266, RP2 and LibreTiny store none and assume it.
  uint32 flags = 1;
}

message DeviceCapabilitiesRequest {


  // Empty
}

message DeviceCapabilitiesResponse {


  BluetoothProxyCapabilities bluetooth_proxy = 1;
  VoiceAssistantCapabilities voice_assistant = 2;
  ZWaveProxyCapabilities zwave_proxy = 3;
  repeated SerialProxyInfo serial_proxies = 4;
  WizardCapabilities wizard = 5;
  SendspinCapabilities sendspin = 6;
  StoreYamlCapabilities store_yaml = 7;
  CrashReportCapabilities crash_report = 8;
}

message DeviceInfo {
  uint32 device_id = 1;
  // max_data_length matches core/config.FRIENDLY_NAME_MAX_LEN via DEVICE_SCHEMA
  string name = 2;
  uint32 area_id = 3;
  DeviceRelation relation = 4;
}

message DeviceInfoRequest {


  // Empty
}

message DeviceInfoResponse {


  // Deprecated in ESPHome 2026.1.0, but kept for backward compatibility
  // with older ESPHome versions that still send this field.
  bool uses_password = 1;

  // The name of the node, given by "App.set_name()" - device hostname
  string name = 2;

  // The mac address of the device. For example "AC:BC:32:89:0E:A9"
  string mac_address = 3;

  // A string describing the ESPHome version. For example "1.10.0"
  string esphome_version = 4;

  // A string describing the date of compilation, this is generated by the compiler
  // and therefore may not be in the same format all the time.
  // If the user isn't using ESPHome, this will also not be set.
  string compilation_time = 5;

  // The model of the board. For example NodeMCU
  // max_data_length matches core/config.BOARD_MAX_LENGTH (validated in platform schemas)
  string model = 6;

  bool has_deep_sleep = 7;

  // The esphome project details if set
  // max_data_length matches core/config.PROJECT_MAX_LENGTH
  string project_name = 8;
  string project_version = 9;

  uint32 webserver_port = 10;

  // Deprecated in API version 1.9
  uint32 legacy_bluetooth_proxy_version = 11;

  // Superseded by DeviceCapabilitiesResponse.bluetooth_proxy as of API 1.15.
  uint32 bluetooth_proxy_feature_flags = 15;

  string manufacturer = 12;

  string friendly_name = 13;

  // Deprecated in API version 1.10
  uint32 legacy_voice_assistant_version = 14;

  // Superseded by DeviceCapabilitiesResponse.voice_assistant as of API 1.15.
  uint32 voice_assistant_feature_flags = 17;

  string suggested_area = 16;

  // The Bluetooth mac address of the device. For example "AC:BC:32:89:0E:AA"
  // Superseded by DeviceCapabilitiesResponse.bluetooth_proxy.mac_address as of API 1.15.
  string bluetooth_mac_address = 18;

  // Supports receiving and saving api encryption key
  bool api_encryption_supported = 19;

  repeated DeviceInfo devices = 20;
  repeated AreaInfo areas = 21;

  // Top-level area info to phase out suggested_area
  AreaInfo area = 22;

  // Indicates if Z-Wave proxy support is available and features supported
  // Superseded by DeviceCapabilitiesResponse.zwave_proxy as of API 1.15.
  uint32 zwave_proxy_feature_flags = 23;
  // Superseded by DeviceCapabilitiesResponse.zwave_proxy as of API 1.15.
  uint32 zwave_home_id = 24;

  // Serial proxy instance metadata
  // Superseded by DeviceCapabilitiesResponse.serial_proxies as of API 1.15.
  repeated SerialProxyInfo serial_proxies = 25;

  // Device is unprovisioned and accepts Noise handshakes with the well-known
  // all-zeros PSK, so the api encryption key can be provisioned without being
  // sent in plaintext (protects against passive sniffing, not active MITM)
  bool api_encryption_provisionable = 26;

  // Device is built with the api outgoing_connection option and can open
  // the TCP connection to a dial-back target itself
  bool api_outgoing_connection_supported = 27;
}

message DeviceWizardRequest {



  // Empty
}

message DisconnectRequest {



  // Do not close the connection before the acknowledgement arrives

  // Optional reason the connection is being closed. Older peers that do not
  // send this field will report DISCONNECT_REASON_UNSPECIFIED (0).
  DisconnectReason reason = 1;
}

message DisconnectResponse {



  // Empty - Both parties are required to close the connection after this
  // message has been received.
}

message ExecuteServiceArgument {

  bool bool_ = 1;
  int32 legacy_int = 2;
  float float_ = 3;
  string string_ = 4;
  // ESPHome 1.14 (api v1.3) make int a signed value
  sint32 int_ = 5;
  repeated bool bool_array = 6;
  repeated sint32 int_array = 7;
  repeated float float_array = 8;
  repeated string string_array = 9;
}

message ExecuteServiceRequest {




  fixed32 key = 1;
  repeated ExecuteServiceArgument args = 2;
  uint32 call_id = 3;
  bool return_response = 4;
}

message ExecuteServiceResponse {




  uint32 call_id = 1; // Matches the call_id from ExecuteServiceRequest
  bool success = 2; // Whether the service execution succeeded
  string error_message = 3; // Error message if success = false
  bytes response_data = 4;
}

message HelloRequest {



  // Description of client (like User Agent)
  // For example "Home Assistant"
  // Not strictly necessary to send but nice for debugging
  // purposes.
  string client_info = 1;
  uint32 api_version_major = 2;
  uint32 api_version_minor = 3;

  // Set by clients that can accept connections the device opens to them
  // (see api: outgoing_connection:). The device remembers this client's
  // address as the target to dial when no such client is connected.
  bool outgoing_connection_target = 4;
}

message HelloResponse {



  // The version of the API to use. The _client_ (for example Home Assistant) needs to check
  // for compatibility and if necessary adopt to an older API.
  // Major is for breaking changes in the base protocol - a mismatch will lead to immediate disconnect_client_
  // Minor is for breaking changes in individual messages - a mismatch will lead to a warning message
  uint32 api_version_major = 1;
  uint32 api_version_minor = 2;

  // A string identifying the server (ESP); like client info this may be empty
  // and only exists for debugging/logging purposes.
  // Currently set to ESPHOME_VERSION string literal.
  string server_info = 3;

  // The name of the server (App.get_name() - device hostname)
  // max_data_length matches ESPHOME_DEVICE_NAME_MAX_LEN (validated by validate_hostname)
  string name = 4;
}

message HomeAssistantStateResponse {




  string entity_id = 1;
  string state = 2;
  string attribute = 3;
}

message HomeassistantActionRequest {




  string service = 1;
  repeated HomeassistantServiceMap data = 2;
  repeated HomeassistantServiceMap data_template = 3;
  repeated HomeassistantServiceMap variables = 4;
  bool is_event = 5;
  uint32 call_id = 6;
  bool wants_response = 7;
  string response_template = 8;
}

message HomeassistantServiceMap {
  string key = 1;
  string value = 2;
}

