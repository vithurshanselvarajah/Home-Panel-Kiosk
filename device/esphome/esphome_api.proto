}

message WizardCapabilities {
  // True when the device has a wizard configured, so DeviceWizardRequest will be answered
  bool configured = 1;
}

message ZWaveProxyCapabilities {
  // Bitmask of the features this proxy supports
  uint32 feature_flags = 1;
  uint32 home_id = 2;
}
